# MissionDebug demo — one container, no ROS install, no source checkout needed.
#
#   docker compose up
#   → open http://localhost:8000 (or http://localhost:8080 if you set HOST_PORT=8080)
#
# First run pulls a pre-built multi-arch image (~30 seconds) from GitHub
# Container Registry. Sessions and the SQLite index live in the `sessions/`
# directory next to this file — delete it to start fresh.
#
# To pin to a specific release, replace ':latest' with a version tag below
# (e.g. ':1.5.0') or with an immutable commit ref (e.g. ':sha-abc1234').
# See https://github.com/mukul-07/missiondebug/pkgs/container/missiondebug
#
# Auth (v2 P4):
#   By default the demo runs in `single` mode — open routes, v1.5
#   behaviour. To demonstrate fleet-tier auth, set MD_MODE + the
#   password on the host before running:
#
#       export MD_MODE=fleet
#       export MD_HUB_AUTH_PASSWORD=demo
#       docker compose up -d --force-recreate
#
#   Or put them in a `.env` file next to this compose.
#   The agent ingest path uses the same secret as a Bearer token
#   unless MD_HUB_AUTH_TOKEN is also set.

services:
  missiondebug:
    image: ghcr.io/mukul-07/missiondebug:latest
    container_name: missiondebug-demo
    environment:
      # Defaults preserve v1.5 open-routes behaviour. Override via
      # shell env or a .env file alongside this compose to flip on
      # fleet auth — see the header comment above.
      MD_MODE: "${MD_MODE:-single}"
      MD_HUB_AUTH_PASSWORD: "${MD_HUB_AUTH_PASSWORD:-}"
      MD_HUB_AUTH_TOKEN: "${MD_HUB_AUTH_TOKEN:-}"
      # Paid-tier license (ee/ features: alerting + lifecycle). The demo ships a
      # built-in DEMO license + its public key so those features work out of the
      # box. A real customer overrides MD_LICENSE_KEY with the key issued to
      # them, and MD_LICENSE_PUBKEY with their own signing public key.
      MD_LICENSE_PUBKEY: "${MD_LICENSE_PUBKEY:-qPDYqAv4RoiOg5md5WMVhbIsTobyE7myY61rUR_U9wA}"
      MD_LICENSE_KEY: "${MD_LICENSE_KEY:-eyJjdXN0b21lciI6Ik1pc3Npb25EZWJ1ZyBEZW1vIiwiZXhwaXJlc19hdCI6bnVsbCwiZmVhdHVyZXMiOlsiYWxlcnRpbmciLCJsaWZlY3ljbGUiXSwiaWQiOiJNRC1ERU1PIiwicm9ib3RzIjoxMDB9.m2vmwHy83vkSEXf0lOX_iYSyMfQdROxKBnWLJ1-H0DoPd4Xm8Z8ygdtqEeVEBAjEedlJOawvLlQf2coj-ml_Ag}"
      # Natural-language incident agent (opt-in). Set MD_LLM_API_KEY in
      # .env to enable the "Ask the incident history" panel. Empty = off.
      MD_LLM_API_KEY: "${MD_LLM_API_KEY:-}"
      MD_LLM_MODEL: "${MD_LLM_MODEL:-}"
      MD_LLM_PROVIDER: "${MD_LLM_PROVIDER:-}"
      MD_LLM_BASE_URL: "${MD_LLM_BASE_URL:-}"
      # Native alerting (opt-in, P6). Set a destination in .env to POST an
      # incident notification on every capture. All empty = off.
      MD_ALERT_SLACK_WEBHOOK: "${MD_ALERT_SLACK_WEBHOOK:-}"
      MD_ALERT_PAGERDUTY_ROUTING_KEY: "${MD_ALERT_PAGERDUTY_ROUTING_KEY:-}"
      MD_ALERT_WEBHOOK_URL: "${MD_ALERT_WEBHOOK_URL:-}"
      MD_ALERT_COOLDOWN_S: "${MD_ALERT_COOLDOWN_S:-}"
      # Deep-link target in alerts + OTel events. Set to your VM's reachable
      # URL (e.g. http://192.168.1.50:8000) so "View in MissionDebug" works
      # from Slack/PagerDuty. Defaults to localhost for same-machine demos.
      MD_HUB_PUBLIC_URL: "${MD_HUB_PUBLIC_URL:-http://localhost:8000}"
      # Age-based lifecycle (opt-in, P5b). cold = release recording bytes but
      # keep the incident record; delete = purge. 0/empty = off.
      MD_COLD_AFTER_DAYS: "${MD_COLD_AFTER_DAYS:-}"
      MD_DELETE_AFTER_DAYS: "${MD_DELETE_AFTER_DAYS:-}"
    ports:
      - "${HOST_PORT:-8000}:8000"
    volumes:
      - ./fixtures:/fixtures:ro
      - ./sessions:/sessions
    restart: unless-stopped

  # One-shot job: populate the fleet incident dashboard so the demo shows
  # the buyable surface (MTTR, recurrence, top patterns, "this happened
  # before" with resolutions) — not just an empty day-one hub. Waits for
  # the backend, POSTs a realistic incident corpus, then exits. Idempotent,
  # so it's safe to re-run on every `docker compose up`. Tiny stdlib-only
  # python script, no pip installs.
  seed:
    image: python:3.12-slim
    container_name: missiondebug-demo-seed
    depends_on:
      - missiondebug
    environment:
      HUB: "http://missiondebug:8000"
      # Mirror the hub's auth so seeding works in fleet mode too.
      MD_HUB_AUTH_PASSWORD: "${MD_HUB_AUTH_PASSWORD:-}"
      MD_HUB_AUTH_TOKEN: "${MD_HUB_AUTH_TOKEN:-}"
    volumes:
      - ./seed:/seed:ro
    command: ["python", "/seed/seed_incidents.py"]
    restart: "no"
